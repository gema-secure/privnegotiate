name: privnegotiate

# 本文件供 auto-deploy / 码道 Skills 使用：该工具只识别仓库根目录的 compose 文件，
# 且会把 --env-file 注入到仓库根 .env，因此这里的 env_file 必须指向 ./.env。
# 手工部署仍用 deploy/compose.yaml（读 deploy/.env）。改动服务定义时两份需同步。

x-app: &app
  build:
    context: ./backend
  env_file:
    - .env
  restart: unless-stopped

services:
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
        required: false

  api:
    <<: *app
    expose:
      - "8000"
    environment:
      INVITE_TOKEN_SECRET: ${INVITE_TOKEN_SECRET:?仓库根 .env 未设置 INVITE_TOKEN_SECRET，请用 secrets.token_urlsafe(48) 生成后填入}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
        required: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3));
          raise SystemExit(0 if d.get('db')=='ok' and d.get('redis')=='ok' else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *app
    command: ["python", "-m", "app.workers.outbox_projection", "--loop"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
        required: false

  web:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 本地全量编排才启动；云上走 RDS + DCS 时不带 --profile local-db。
  mysql:
    profiles: ["local-db"]
    image: mysql:8.0
    env_file:
      - .env
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  redis:
    profiles: ["local-db"]
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
