# 前端静态产物 + API 反向代理。生产环境唯一对外入口。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 菜单截图以 base64 提交，后端上限 6MB 图片，这里留出编码膨胀余量。
    client_max_body_size 12m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # 运维探针：直接透传 API 的健康检查，便于在浏览器/命令行确认后端状态。
    location = /healthz {
        proxy_pass http://api:8000/healthz;
        access_log off;
    }

    # 前端请求 /api/xxx，后端路由无 /api 前缀：proxy_pass 末尾的斜杠负责剥前缀。
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 求解与 MaaS 识别都是同步长请求，短于后端上限会被 Nginx 截断成 504。
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Vite 构建产物带内容哈希，可长期缓存。
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 前端是 history 路由，刷新子路径必须回落到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
