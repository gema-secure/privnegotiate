name: Reproduce and verify
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.12.14 仅发布了 linux/rhel 构建，Windows 上 setup-python 会报版本不存在；
          # 3.12.9 是 actions/python-versions 清单中三平台齐全的最高 3.12.x
          python-version: '3.12.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python backend/scripts/contract_snapshot.py --check
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
